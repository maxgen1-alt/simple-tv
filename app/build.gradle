plugins {
    id 'com.android.application'
}

dependencies {
    // Reads the words on screen for the game banner (bundled model, works offline)
    implementation 'com.google.mlkit:text-recognition:16.0.1'
}

android {
    namespace 'com.maxgendler.simpletv'
    compileSdk 35

    defaultConfig {
        applicationId 'com.maxgendler.simpletv'
        minSdk 26
        targetSdk 34
        // GitHub builds count up (build 25 -> versionCode 125), so updates always look newer
        def run = (System.getenv('VERSION_CODE') ?: '0').toInteger()
        versionCode run + 100
        versionName "2.$run"
    }

    // Same key every build, so updates install over the old version.
    // The key is NOT in this repo: GitHub builds get it from the repo's Secrets
    // (SIGNING_KEY_B64 / SIGNING_KEY_PASSWORD). Local builds use Android's debug key.
    def signingFile = System.getenv('SIGNING_KEY_FILE')
    signingConfigs {
        release {
            if (signingFile) {
                storeFile file(signingFile)
                storeType 'pkcs12'
                storePassword System.getenv('SIGNING_KEY_PASSWORD')
                keyAlias System.getenv('SIGNING_KEY_ALIAS')
                keyPassword System.getenv('SIGNING_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingFile ? signingConfigs.release : signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
